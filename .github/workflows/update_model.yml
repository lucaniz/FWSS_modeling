name: Update gas model
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
jobs:
  refit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install requests numpy scipy --quiet

      - name: Run refit
        run: python3 scripts/refit_model.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f calculator.html capacity.html extreme_modeling.html
          git diff --cached --quiet || git commit -m "auto: refit PP and addPieces models from FOC Observer mainnet data"
          git push
